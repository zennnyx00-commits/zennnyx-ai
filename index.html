<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZennNyx AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="top-bar">
                <span class="status">CLOUD • RTDB</span>
                <span id="clock" class="clock">00.00.00</span>
            </div>
            <div class="marquee-container">
                <marquee scrollamount="4">> SYSTEM_ONLINE > ZennNyx AI V3.6 FLASH > AWAITING_COMMAND ></marquee>
            </div>
        </header>

        <main id="chat-box">
            <div class="message system">
                [SYS] ZennNyx AI terhubung.
                <br>> Mode: Asisten & Analisis.
            </div>
        </main>

        <footer>
            <div class="toolbar">
                <div class="toggle-container">
                    <span class="toggle-label">Deep Think</span>
                    <label class="switch">
                        <input type="checkbox" id="deep-think-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <span id="file-indicator" class="file-status"></span>
            </div>
            
            <div class="input-wrapper">
                <label for="image-upload" class="icon-btn" title="Upload Gambar">
                    <!-- Ikon Gambar Vector -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </label>
                <input type="file" id="image-upload" accept="image/*" hidden>
                
                <input type="text" id="user-input" placeholder="Ketik perintah di sini..." autocomplete="off">
                
                <button id="send-btn" class="icon-btn">
                    <!-- Ikon Send Vector -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
